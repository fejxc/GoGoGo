plugins {
    id "com.android.application"
}

// 读取高德地图 Key：local.properties 中的 MAPS_API_KEY（未填时用空值占位，保证可编译）
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def amapApiKey = localProps.getProperty('MAPS_API_KEY', '')

android {
    ndkVersion = '26.2.11394342'
    compileSdk = 34
    buildToolsVersion = '36.0.0'
    namespace = 'com.sunyun.anygo'

    // 签名：keystore 不入库（防伪造签名），路径与密码通过 local.properties 提供
    // 本地: KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
    // CI  : 从仓库 Secret(SIGNING_KEY 等) 还原 keystore 后写入 local.properties（见 build-release.yml）
    def ksFile = localProps.getProperty('KEYSTORE_FILE')
    def ksExists = ksFile != null && file(ksFile).exists()

    signingConfigs {
        anygo {
            if (ksExists) {
                storeFile file(ksFile)
                storePassword localProps.getProperty('KEYSTORE_PASSWORD')
                keyAlias localProps.getProperty('KEY_ALIAS', 'anygo')
                keyPassword localProps.getProperty('KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        // 安装包名：与高德控制台 Key 绑定一致，勿改动（内部源码包名 namespace 与之独立）
        applicationId "com.sunyun.gogogo"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 2000    // 内部递增号（须高于此前测试包的 1200，否则无法覆盖安装）
        versionName '1.0.0' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        // 注入高德 Key 到 AndroidManifest 的 meta-data 占位符
        manifestPlaceholders += [MAPS_API_KEY: amapApiKey]
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig = signingConfigs.anygo
            multiDexEnabled = true
        }
        debug {
            if (ksExists) {
                signingConfig = signingConfigs.anygo   // debug/release 同一私有 keystore，SHA1 一致
            }
            // 无 keystore 时回退 Android 默认 debug 签名
        }
    }

    // 要存取 secret value 必須要使用到一個 BuildScript 的類別，默认会从 local.properties 中获取
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出的可执行程序的名字
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "AnyGo_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "AnyGo_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName=fileName
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AppCompat 1.5.1 开始显式依赖于 Lifecycle 2.5.1 和 SavedState 1.2.0
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    // 高德地图全家桶（3D地图 + 定位 + 搜索），官方控制台创建 Android 平台 Key 后填入 local.properties 的 MAPS_API_KEY
    implementation 'com.amap.api:3dmap-location-search:10.1.300_loc6.4.9_sea9.7.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
